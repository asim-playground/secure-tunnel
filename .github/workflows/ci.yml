name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deps:
    name: Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: false
      - name: Enable kache Rust wrapper
        id: kache-env
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP:-$PWD/.cache}/kache"
          mkdir -p "$cache_dir"
          echo "KACHE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-deps
      - name: Cache kache compiler outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.kache-env.outputs.cache_dir }}
          key: ${{ runner.os }}-kache-${{ hashFiles('**/Cargo.lock', 'mise.lock') }}-deps
          restore-keys: |
            ${{ runner.os }}-kache-
      - name: Setup environment
        run: mise run setup
      - name: Verify kache setup
        run: |
          kache --version
          kache stats || true
      - name: Run dependency checks
        run: mise run deps-check
      - name: Quiesce kache cache
        if: always()
        run: |
          kache daemon stop || true
          find "$KACHE_CACHE_DIR" -type s -delete 2>/dev/null || true
          rm -f "$KACHE_CACHE_DIR/daemon.sock" 2>/dev/null || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: false
      - name: Enable kache Rust wrapper
        id: kache-env
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP:-$PWD/.cache}/kache"
          mkdir -p "$cache_dir"
          echo "KACHE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-lint
      - name: Cache kache compiler outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.kache-env.outputs.cache_dir }}
          key: ${{ runner.os }}-kache-${{ hashFiles('**/Cargo.lock', 'mise.lock') }}-lint
          restore-keys: |
            ${{ runner.os }}-kache-
      - name: Setup environment
        run: mise run setup
      - name: Verify kache setup
        run: |
          kache --version
          kache stats || true
      - name: Run lint suite
        run: mise run lint-all
      - name: Quiesce kache cache
        if: always()
        run: |
          kache daemon stop || true
          find "$KACHE_CACHE_DIR" -type s -delete 2>/dev/null || true
          rm -f "$KACHE_CACHE_DIR/daemon.sock" 2>/dev/null || true

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: false
      - name: Enable kache Rust wrapper
        id: kache-env
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP:-$PWD/.cache}/kache"
          mkdir -p "$cache_dir"
          echo "KACHE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-test
      - name: Cache kache compiler outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.kache-env.outputs.cache_dir }}
          key: ${{ runner.os }}-kache-${{ hashFiles('**/Cargo.lock', 'mise.lock') }}-test
          restore-keys: |
            ${{ runner.os }}-kache-
      - name: Setup environment
        run: mise run setup
      - name: Verify kache setup
        run: |
          kache --version
          kache stats || true
      - name: Run full test suite
        if: runner.os != 'Windows'
        shell: bash
        run: mise run test
      - name: Run Kotlin SDK package smoke
        if: runner.os != 'Windows'
        shell: bash
        run: mise run sdk:kotlin
      - name: Run Swift SDK package smoke
        if: runner.os == 'macOS'
        shell: bash
        run: mise run sdk:swift
      - name: Run Rust workspace tests
        if: runner.os == 'Windows'
        shell: bash
        run: mise x -- cargo test --workspace
      - name: Quiesce kache cache
        if: always()
        shell: bash
        run: |
          kache daemon stop || true
          find "$KACHE_CACHE_DIR" -type s -delete 2>/dev/null || true
          rm -f "$KACHE_CACHE_DIR/daemon.sock" 2>/dev/null || true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: false
      - name: Enable kache Rust wrapper
        id: kache-env
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP:-$PWD/.cache}/kache"
          mkdir -p "$cache_dir"
          echo "KACHE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-coverage
      - name: Cache kache compiler outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.kache-env.outputs.cache_dir }}
          key: ${{ runner.os }}-kache-${{ hashFiles('**/Cargo.lock', 'mise.lock') }}-coverage
          restore-keys: |
            ${{ runner.os }}-kache-
      - name: Setup environment
        run: mise run setup
      - name: Verify kache setup
        run: |
          kache --version
          kache stats || true
      - name: Generate coverage
        run: mise run rust:coverage
      - name: Quiesce kache cache
        if: always()
        run: |
          kache daemon stop || true
          find "$KACHE_CACHE_DIR" -type s -delete 2>/dev/null || true
          rm -f "$KACHE_CACHE_DIR/daemon.sock" 2>/dev/null || true
      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/

  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          env: false
      - name: Enable kache Rust wrapper
        id: kache-env
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP:-$PWD/.cache}/kache"
          mkdir -p "$cache_dir"
          echo "KACHE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=kache" >> "$GITHUB_ENV"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-cross-${{ matrix.target }}
      - name: Cache kache compiler outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.kache-env.outputs.cache_dir }}
          key: ${{ runner.os }}-kache-${{ hashFiles('**/Cargo.lock', 'mise.lock') }}-cross-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-kache-
      - name: Install cross
        run: cargo install cross --locked
      - name: Setup environment
        run: mise run setup
      - name: Verify kache setup
        run: |
          kache --version
          kache stats || true
      - name: Cross compile and test portable crates
        run: cross test --release --all-features --workspace --target ${{ matrix.target }}
      - name: Quiesce kache cache
        if: always()
        run: |
          kache daemon stop || true
          find "$KACHE_CACHE_DIR" -type s -delete 2>/dev/null || true
          rm -f "$KACHE_CACHE_DIR/daemon.sock" 2>/dev/null || true
