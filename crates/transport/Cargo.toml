[package]
name = "secure-tunnel-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

description = "Production carrier adapters for Secure Tunnel"
homepage = "https://github.com/asim-playground/secure-tunnel"
repository = "https://github.com/asim-playground/secure-tunnel"
documentation = "https://docs.rs/secure-tunnel-transport"
readme = "../../README.md"
keywords = ["secure-tunnel", "transport", "quic", "websocket"]
categories = ["network-programming"]

[dependencies]
futures-util = "0.3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secure-tunnel-core = { path = "../core", version = "0.1.0" }
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
rcgen = "0.14"
secure-tunnel-core = { path = "../core", version = "0.1.0", features = ["test-support"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
