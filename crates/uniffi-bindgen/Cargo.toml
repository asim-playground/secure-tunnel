[package]
name = "secure-tunnel-uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

description = "Project-local UniFFI binding generator for Secure Tunnel"
homepage = "https://github.com/asim-playground/secure-tunnel"
repository = "https://github.com/asim-playground/secure-tunnel"
documentation = "https://docs.rs/secure-tunnel-uniffi-bindgen"
readme = "../../README.md"
keywords = ["secure-tunnel", "uniffi", "bindgen"]
categories = ["development-tools"]

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[[bin]]
name = "secure-tunnel-uniffi-bindgen"
path = "src/main.rs"

[lints]
workspace = true
