[tools]
"cargo:cargo-audit" = { version = "0.22.2", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-deny" = { version = "0.19.9", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-hack" = { version = "0.6.45", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-insta" = { version = "1.48.0", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-llvm-cov" = { version = "0.8.7", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-msrv" = { version = "0.19.3", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-mutants" = { version = "25.3.1", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-nextest" = { version = "0.9.137", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-outdated" = { version = "0.19.0", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cargo-watch" = { version = "8.5.3", install_env = { RUSTC_WRAPPER = "" } }
"cargo:cbindgen" = { version = "0.29.4", install_env = { RUSTC_WRAPPER = "" } }
"cargo:flutter_rust_bridge_codegen" = { version = "2.13.0-beta.2", install_env = { RUSTC_WRAPPER = "" } }
"cargo:leptosfmt" = { version = "0.1.33", install_env = { RUSTC_WRAPPER = "" } }
"cargo:trunk" = { version = "0.21.14", install_env = { RUSTC_WRAPPER = "" } }
"cargo:wasm-bindgen-cli" = { version = "0.2.125", install_env = { RUSTC_WRAPPER = "" } }
"cargo:wasm-pack" = { version = "0.15.0", install_env = { RUSTC_WRAPPER = "" } }
"github:WebAssembly/wabt" = "1.0.41"
"go:github.com/google/addlicense" = "1.2.0"

actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.20.0"
fd = "10.4.2"
flutter = "3.44.0-stable"
go = "1.26.4"
golangci-lint = "2.12.2"
gradle = "9.3.1"
java = "corretto-21.0.11.10.1"
jq = "1.8.1"
markdownlint-cli2 = "0.22.0"
python = "3.14.6"
rust = { version = "1.96.0", components = "rustfmt,clippy,llvm-tools,rust-src", targets = "wasm32-unknown-unknown,wasm32-wasip1" }
"github:kunobi-ninja/kache" = "0.6.0"
shellcheck = "0.11.0"
uv = "0.11.23"

[task_config]
includes = ["mise-tasks"]

[env]
LIBRARY_PATH = "${LIBRARY_PATH:-}:/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib:/opt/homebrew/opt/libiconv/lib"
MACOSX_DEPLOYMENT_TARGET = "11.0"
RUST_BACKTRACE = "1"
RUSTC_WRAPPER = "kache"

[hooks]
postinstall = { run = "bash scripts/mise-postinstall.sh", shell = "bash -c" }

[settings]
env_shell_expand = true
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
